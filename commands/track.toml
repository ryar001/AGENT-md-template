description = "Transactional Checkpoint"
silence = true

prompt = """
[Help Mode]
IF input contains `--help`:
  Output:
    \"""
    Usage: `/track`
    Description: Transactional Checkpoint. Runs AI Tracker, bumps version, commits changes.
    Inputs: None.
    \"""
  STOP immediately.


Goal is to immediately execute the `run_ai_tracker` tool and synchronize version numbers.

1.  **Preparation**:
    - Read `__version__.py` to capture the **Current Version**.
    - Store this version string in a temporary file `.version_tmp`.

2.  **Execute Tracker**:
    - Execute `uvx dev-mcp run_ai_tracker --path .`.
    - If `uvx` fails, prompt for dev-tools config.

3.  **Debug Loop**:
    - If bugs reported -> `/debug`. Recursively fix until clean.

4.  **Version Synchronization**:
    - Read `__version__.py` again to get the **New Version**.
    - Read `.version_tmp` to retrieve the **Old Version**.
    - **IF** `New Version` != `Old Version`:
        - Identify potential configuration files: `pyproject.toml`, `gemini-extension.json`.
        - For each file found:
            - Read content.
            - **IF** content contains `version` AND the `Old Version` string:
                - Replace `Old Version` -> `New Version`.
                - Save file.
                - Log: "Synced version in {filename}".

5.  **Finalize**:
    - Create/Update `UPDATES.md` with changes.
    - Remove temporary file `.version_tmp`.
    - Output: "✅ Tracked & Synced ({Old Version} -> {New Version})."
"""
