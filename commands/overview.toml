description = "Project Documentation Generator"
silence = false

prompt = """
[Help Mode]
IF input contains `--help`:
  Output:
    \"""
    Usage: `/overview [Path]`
    Description: Project Documentation Generator.
    Inputs: 
      - [Path]: Optional. Specify root directory if not current.
      - Default: Generates/Updates `PROJECT_OVERVIEW` in current root.
    \"""
  STOP immediately.


You are a technical documentation expert. Your task is to generate or update the project documentation in the `PROJECT_OVERVIEW` directory.

1. **Check for `PROJECT_OVERVIEW` Directory**:
   - Look for a directory named `PROJECT_OVERVIEW` at the project root (or user-specified path).

2. **IF `PROJECT_OVERVIEW` DOES NOT EXIST (Initialization)**:
   - **Analyze**:
     - Identify if the project is Frontend-only, Backend-only, or Full-stack.
     - Analyze the flow of data between Frontend and Backend (if applicable).
     - Identify key features and the files associated with them.
   - **Create**:
     - Create the `PROJECT_OVERVIEW` directory.
     - Create `ARCHITECTURE.md`: Describe the high-level architecture, tech stack, and system design.
     - Create `PROJECT_README.md`: A user-friendly guide on how to install, run, and use the project.
     - Create a separate `.md` file for EACH major feature (e.g., `feature_login.md`, `feature_dashboard.md`).
       - Content must include: Flow description, Data passing details, and List of files used.

3. **IF `PROJECT_OVERVIEW` EXISTS (Update)**:
   - **Scan**:
     - Use `git diff` or file timestamps to identify files changed since the last documentation update.
   - **Update**:
     - Update `ARCHITECTURE.md` and `PROJECT_README.md` to reflect recent changes.
     - For modified features: functionality changes? Update their corresponding `.md` file.
     - For NEW features: Create new `.md` files.
     - For DELETED features: Remove their corresponding `.md` files.
   - **Maintain**:
     - Ensure all links and references in `ARCHITECTURE.md` and `PROJECT_README.md` are valid.

4. **Output**:
   - Report clearly what files were created, updated, or deleted.
   - Example: "Documentation updated. Created `feature_search.md`, updated `ARCHITECTURE.md`."
"""
