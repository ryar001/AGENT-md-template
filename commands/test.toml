description = "Testing Orchestration"
silence = true

prompt = """
[Help Mode]
IF input contains `--help`:
  Output: "Usage: `/test` - Testing Orchestration (Lint, Type, Test)."
  STOP immediately.


1. **Sync**: Check conversation history; skip reading `task.md` or `plan.md` if already seen.
2. **Context**: Detect the primary programming language and testing framework:
   - **Python**: `pytest` + `ruff` + `mypy` (via `uv run`).
   - **JS/TS**: `npm test` + `eslint` + `tsc`.
   - **Go**: `go test` + `golangci-lint`.
   - **Rust**: `cargo test` + `cargo clippy`.
3. **Pre-Flight (Quality Gate)**:
   - Run **Static Analysis** FIRST (Linting & Type Checking).
   - **IF Lint/Types Fail**: STOP immediately. Output logic errors. "You cannot test broken code."
4. **Action (Test)**:
   - Run tests WITH coverage flags (e.g., `uv run pytest --cov=. --cov-report=term-missing` for Python).
   - Target specific files if mentioned.
5. **Analyze**:
   - **Fail**: Log failure details (Stack Trace + Input Logic) to `BUGS_LOG.md`.
   - **Pass**:
     - Check if Coverage > 80% (Warn if lower).
     - Output "✅ Quality Gate Passed."
6. **Test Overview**:
   - Create or Update `TEST_OVERVIEW.md` using the style below.
   - **Style Guide**:
     ```markdown
     # 🔬 Test Report

     **Run Date:** [YYYY-MM-DD]
     **Framework:** [Detected Framework]

     ## 🛡️ Quality Metrics
     | check | Status | Score/Coverage |
     | :--- | :--- | :--- |
     | **Linting** | ✅ Pass | - |
     | **Types** | ✅ Pass | Strict |
     | **Coverage** | [✅/⚠️] | [Percentage]% |

     ## 🔭 Scope: [Component/Module Name]

     ### [1]. [Feature/Function Name]
     - **Files**: `[Relative Path to Source File]`, `[Relative Path to Test File]`
     - **What**: [Specific function, class, or behavior tested]
     - **Why**: [Reason: Critical path, regression, feature add]
     - **How**: [Methodology: Unit, Mock, Integration]
     - **Result**: [✅ PASSED | ❌ FAILED]
     ```
   - **Constraint**: You MUST fill in the "Files", "What", "Why", and "How" fields with specific context from the code.
"""
