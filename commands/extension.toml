description = "Extension Manager (Install/Update)"

prompt = """
[Help Mode]
IF input contains `--help`:
  Output:
    \"""
    Usage: `/extension <subcommand> <args>`
    Description: Extension Manager (Install/Update).
    Inputs:
      - install <URL> [--global]: Install from Git URL.
      - update <Name> [--global]: Update existing extension.
    \"""
  STOP immediately.


Usage: `/extension <subcommand> <args>`
Subcommands: `update`, `install`

1.  **Parse Command**:
    - **`install <PACKAGE_URL> [--global]`**:
        - `PACKAGE_URL`: Git repository URL.
        - `PACKAGE_NAME`: Extracted from URL (e.g., `github.com/user/my-agent` -> `my-agent`).
        - **Action**:
            - Check if `~/.gemini/extensions/<PACKAGE_NAME>` exists.
            - IF EXISTS: Abort or prompt validation.
            - IF NEW: Run `git clone <PACKAGE_URL> ~/.gemini/extensions/<PACKAGE_NAME>`.
            - Proceed to **Sync Step**.

    - **`update <PACKAGE_NAME> [--global]`**:
        - `PACKAGE_NAME`: Name of the extension directory.
        - **Action**:
            - Check if `~/.gemini/extensions/<PACKAGE_NAME>` exists.
            - IF MISSING: Error "Extension not found".
            - IF FOUND: Run `git pull` inside that directory.
            - Proceed to **Sync Step**.

3.  **Sync Step (Rules & Workflows)**:
    - **Source Extension**: `~/.gemini/extensions/<PACKAGE_NAME>`
    - **Target Destinations**:
        - **Workflows**:
             - Default: `<CurrentWorkspace>/.agent/workflows/`
             - If `--global`: `~/.gemini/antigravity/global_workflows/`
        - **Rules (Base)**: `<CurrentWorkspace>/` (or `~/.gemini/` if `--global`)

    - **Logic**:
        1. **Identify Rule File**:
            - Check `Source/GEMINI.md`. IF EXISTS: Set `RULE_FILE = GEMINI.md`.
            - ELSE Check `Source/AGENT.md`. IF EXISTS: Set `RULE_FILE = AGENT.md`.
            - ELSE:
                - **Prompt User**: "No Agent Rule file (GEMINI.md/AGENT.md) found in extension. Create a new one? (Y/N)"
                - IF Y: Create default `AGENT.md` in Source. Set `RULE_FILE = AGENT.md`.
                - IF N: Skip Rule Sync.

        2. **Sync Rule File**:
            - **Target Path**: `<Target Base>/<RULE_FILE>`
            - Compare `Source/<RULE_FILE>` with `Target Path`.
            - IF **IDENTICAL**: Skip.
            - IF **DIFFERENT** or **TARGET MISSING**:
                - IF **TARGET MISSING**: Copy silently.
                - IF **DIFFERENT**:
                    - Generate diff.
                    - Create `AGENT_RULE_CHANGES` artifact.
                    - **Prompt User**:
                        - "Rules (<RULE_FILE>) have changed. View diff at [AGENT_RULE_CHANGES]. Options:"
                        - "1. **Replace**: Overwrite target with source."
                        - "2. **Merge**: Manually merge changes."
                        - "3. **Ignore**: Keep current target."
                    - Perform action.

        3. **Sync Dependencies (Relative Paths)**:
            - **Parse** `Source/<RULE_FILE>` for referenced agent files.
            - Look for patterns like `AGENTS/*.md` or paths defined in "Language Specific Instructions" tables.
            - FOR EACH `ReferencedFile`:
                - Resolve `SourcePath` = `SourceDir` + `ReferencedFile`.
                - Resolve `TargetPath` = `TargetDir` + `ReferencedFile`.
                - IF `SourcePath` EXISTS:
                    - Ensure `TargetDir` parent directories exist.
                    - Copy `SourcePath` to `TargetPath` (overwriting or prompting if significantly different, similar to Rule File logic, or just overwrite for simplicity on dependencies).
                    - *Note*: Ensure the path structure relative to `RULE_FILE` is preserved.

        2. **Workflow Conversion**:
            - List all `.toml` files in `Source/commands/`.
            - For each TOML file:
              - Read content.
              - Parse `description` and `prompt`.
              - Create `<Destination>/<filename>.md`.
              - Format:
                ```markdown
                ---
                description: {description_from_toml}
                ---

                {prompt_from_toml}
                ```

4.  **Report**:
    - Output: "✅ Extension <PACKAGE_NAME> [installed/updated]."
    - List updated files (Rules and Workflows) and any skipped changes.
"""
